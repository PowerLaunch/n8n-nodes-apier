name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # No lockfile is committed yet (see the README); npm install resolves the exact pinned devDependencies.
      # --legacy-peer-deps: without it npm's peer resolution dies with "Cannot read properties of null
      # (reading 'edgesOut')" on this tree (runs 39771021337 and 39771121220).
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run
